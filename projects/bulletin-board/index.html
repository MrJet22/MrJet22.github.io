<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <ul>
                <li>
                    <div class="post-it">
                        <h2>Hello, I am Mr. Jet</h2>
                    </div>

                    <div class="post-it">
                        <p>Mace Windu fell out of a window.
                         when do you think he will come back?
                        </p>
                    </div>

                    <div class="post-it">
                    <img src="images/frame.jpg" alt="corkboard" width="200">
                    </div>
                </li>

                <li>
                    <div class="post-it">
                        <h2>Don't forget to go to the store!</h2>
                    </div>

                    <div class="post-it">
                        <ul>
                            <li>Eggs</li>
                            <li>Milk</li>
                            <li>Bread</li>
                            <li>Cheddar Cheese</li>
                            <li>Orange Juice</li>
                            <li>Lettuce</li>
                            <li>Crackers</li>
                        </ul>
                    </div>

                    <div class="post-it">
                        <h1>You are more than good enough!</h1>
                    </div>
                </li>

            </ul>
        </div>
    </body>
</html>
